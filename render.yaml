services:
  - type: web
    name: mydownloader
    env: python
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:${PORT} -w 2 --timeout 300 app:app
    repo: https://github.com/azhar0407/mydownloader
    branch: main
    autoDeploy: true